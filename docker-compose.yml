# The two databases the project needs, for running it on your own machine:
#
#   docker compose up -d
#
# - Postgres 16 with the pgvector extension  -> localhost:5432
# - Qdrant (vector database)                 -> localhost:6333
#
# The credentials below are for local development only.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vns
      POSTGRES_PASSWORD: vns_local_dev
      POSTGRES_DB: vns
    ports:
      - "5432:5432"
    volumes:
      - vns_postgres:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "6333:6333"
    volumes:
      - vns_qdrant:/qdrant/storage

volumes:
  vns_postgres:
  vns_qdrant:
